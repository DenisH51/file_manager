<!DOCTYPE html>
<html>

<body>

<h1>Register</h1>


<form action="/api/auth/registrate" method="post">

    <input 
        type="email"
        name="email"
        placeholder="Email"
    >

    <br>


    <input 
        type="text"
        name="username"
        placeholder="Username"
    >

    <br>


    <input 
        type="password"
        name="password"
        placeholder="Password"
    >

    <br>


    <button type="submit">
        Register
    </button>


</form>


</body>

</html>
